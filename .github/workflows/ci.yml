# check config syntax
name: syntax

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: purcell/setup-emacs@master
        with:
          version: "31.1"

      - name: check syntax
        run: |
          bash -n install-dependencies.sh
          emacs -Q --batch -l test/ci-test.el
